# Global journal bounds for this small server. This keeps schedulebot and other
# service logs useful for diagnostics without allowing persistent logs to grow
# without limit.
[Journal]
Storage=persistent
SystemMaxUse=512M
SystemKeepFree=2G
SystemMaxFileSize=64M
MaxRetentionSec=30day

# Fallback bounds if persistent storage is temporarily unavailable.
RuntimeMaxUse=64M
RuntimeKeepFree=256M
